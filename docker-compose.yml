version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nestjs-users-backend
    environment:
      - PORT=3080
      - DB_HOST=db
      - DB_USER=alumno
      - DB_PASSWORD=alumno123
      - DB_NAME=users_db
      - DB_PORT=3306
    ports:
      - "3080:3080"
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: mysql-users-db
    environment:
      - MYSQL_ROOT_PASSWORD=admin123
      - MYSQL_DATABASE=users_db
      - MYSQL_USER=alumno
      - MYSQL_PASSWORD=alumno123
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "alumno", "-palumno123"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dbdata: